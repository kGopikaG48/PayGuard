<!DOCTYPE html>
<html>
<head>
    <title>PayGuard Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
            text-align: center;
        }
        .box {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
        }
        .pay-btn { background-color: #0070ba; color: white; }
        .pay-btn:hover { background-color: #003087; }
        
        .retry-btn { background-color: #d9534f; color: white; }
        .retry-btn:hover { background-color: #c9302c; }
        
        .new-btn { background-color: #e0e0e0; color: #333; }
        .new-btn:hover { background-color: #d0d0d0; }

        pre {
            background: #0f172a;
            color: #38bdf8;
            padding: 14px;
            border-radius: 6px;
            text-align: left;
            font-size: 13px;
            overflow-x: auto;
            line-height: 1.4;
        }
        .key-box {
            background: #eef2f7;
            padding: 10px;
            margin: 15px 0;
            font-family: monospace;
            border-radius: 4px;
            color: #1e40af;
            font-weight: bold;
        }
        .details {
            text-align: left;
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }
        .details p { 
            margin: 6px 0; 
            font-size: 14px;
            color: #334155;
        }
        .tip {
            font-size: 11px;
            color: #64748b;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>PayGuard Checkout</h2>
    
    <!-- Payment Info Box -->
    <div class="details">
        <p>Payer: <span id="payer-text"></span></p>
        <p>Recipient: <span id="recipient-text"></span></p>
        <p>Amount: <strong id="amount-text"></strong></p>
    </div>

    <!-- Active Session Key -->
    <div class="key-box">
        Session Key: <span id="key-display">...</span>
    </div>

    <!-- Buttons -->
    <button class="pay-btn" id="pay-button" onclick="makePayment()">Pay Now</button>
    <button class="retry-btn" onclick="simulateRetry()">⚡ Simulate Double-Click</button>
    <button class="new-btn" onclick="startNewSession()">Start New Checkout Session</button>

    <div class="tip">
        💡 <b>How to test:</b><br>
        - Click <b>Pay Now</b> twice with the same key ➔ Blocked as duplicate.<br>
        - Click <b>Simulate Double-Click</b> ➔ Sends 2 requests at once.
    </div>

    <h3>Server Response Log:</h3>
    <pre id="output">Ready to checkout...</pre>
</div>

<script>
    // 1. Simple configuration variables
    const serverUrl = "http://127.0.0.1:8000/pay";
    const amountValue = 30000;
    const recipientName = "XYZ Garments";
    const payerName = "Alice";
    let sessionKey = "";

    // 2. Put variables into the HTML page text automatically
    document.getElementById("payer-text").innerText = payerName;
    document.getElementById("recipient-text").innerText = recipientName;
    document.getElementById("amount-text").innerText = "Rs. " + amountValue;
    document.getElementById("pay-button").innerText = "Pay Rs. " + amountValue + " Securely";

    // 3. Generate a simple random session key
    function generateNewSessionKey() {
        sessionKey = "key-" + Math.floor(Math.random() * 100000);
        document.getElementById("key-display").innerText = sessionKey;
    }

    // Run automatically when the page opens
    generateNewSessionKey();

    // Reset session if starting a fresh purchase
    function startNewSession() {
        generateNewSessionKey();
        document.getElementById("output").innerText = "New checkout session started. Ready to pay.";
    }

    // 4. Send payment request to your FastAPI backend
    async function makePayment() {
        document.getElementById("output").innerText = "Processing payment...";

        try {
            const response = await fetch(serverUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Idempotency-Key": sessionKey
                },
                body: JSON.stringify({
                    amount: amountValue,
                    recipient: recipientName,
                    payer: payerName
                })
            });

            const data = await response.json();
            
            // Show clean, easy-to-read text in the black box
            if (data.status === "success") {
                document.getElementById("output").innerText = 
                    "SUCCESS! (New Transaction)\n" +
                    "------------------------------------\n" +
                    "Transaction ID : " + data.data.transaction_id + "\n" +
                    "Ledger Status  : " + data.data.ledger_status + "\n" +
                    "Amount Debited : Rs. " + data.data.amount;
            } else {
                document.getElementById("output").innerText = 
                    "DUPLICATE BLOCKED! (Cache Hit)\n" +
                    "------------------------------------\n" +
                    "Message        : " + data.message + "\n" +
                    "Original ID    : " + data.data.transaction_id;
            }
        } catch (error) {
            document.getElementById("output").innerText = "Error: Make sure your FastAPI backend is running!";
        }
    }

    // 5. Send two identical requests at the exact same time
    function simulateRetry() {
        document.getElementById("output").innerText = "Simulating double-click retry...";
        makePayment();
        makePayment();
    }
</script>

</body>
</html>
